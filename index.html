<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nghe Chép Chính Tả (Pro Version)</title>
  <style>
    :root {
      --jade: #2F5D55;
      --jade-soft: #eaf1ef;
      --gold: #C9A24B;
      --ink: #1c1a17;
      --ink-soft: #5c5954;
      --paper: #fdfcf8;
      --paper-deep: #f5f2eb;
      --line: #e3dcc7;
      --wrong: #c0392b;
      --wrong-bg: #fdf0ed;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--paper-deep);
      color: var(--ink);
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: var(--jade);
      margin-top: 0;
      margin-bottom: 30px;
    }

    /* BỐ CỤC 2 CỘT */
    .app-layout {
      display: flex;
      gap: 30px; /* Tăng khoảng cách giữa 2 cột cho thoáng */
      max-width: 1200px;
      margin: 0 auto;
      height: calc(100vh - 120px);
    }

    /* CỘT TRÁI: DANH SÁCH CÂU */
    .sidebar {
      flex: 0 0 280px;
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 18px;
      color: var(--jade);
      border-bottom: 2px solid var(--jade-soft);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .sentence-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px; /* Tăng khoảng cách các nút câu hỏi */
      padding-right: 10px;
    }

    .sentence-list::-webkit-scrollbar { width: 6px; }
    .sentence-list::-webkit-scrollbar-thumb { background-color: var(--line); border-radius: 10px; }

    .btn-play-sentence {
      background: var(--paper-deep);
      border: 1px solid var(--line);
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: bold;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
      font-size: 14px;
    }

    .btn-play-sentence:hover, .btn-play-sentence.active {
      background: var(--jade);
      color: #fff;
      border-color: var(--jade);
      transform: translateX(5px);
    }

    /* CỘT PHẢI: VIDEO & ĐIỀN CHỮ */
    .main-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 30px; /* Nới rộng khoảng cách giữa video và phần điền chữ */
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* KHU VỰC TƯƠNG TÁC (TỐI ƯU MỚI) */
    .interaction-area {
      background: #fff;
      border-radius: 20px;
      padding: 30px; /* Tăng độ thở cho viền */
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .vietnamese-hint {
      font-size: 18px;
      color: var(--ink-soft);
      margin-bottom: 25px;
      font-style: italic;
      text-align: center;
    }

    /* Bọc cả Điều hướng và Ô chữ trên cùng 1 hàng ngang */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px; /* Khoảng cách giữa nút bấm và ô chữ */
      flex-wrap: wrap;
      width: 100%;
    }

    /* THANH ĐIỀU HƯỚNG BÊN TRÁI */
    .controls-bar {
      display: flex;
      gap: 12px;
    }

    /* Biến nút thành hình tròn nhỏ gọn giống media player */
    .btn-control {
      background: var(--paper-deep);
      border: 2px solid var(--line);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 18px;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .btn-control:hover { 
      background: var(--jade-soft); 
      color: var(--jade); 
      border-color: var(--jade); 
      transform: scale(1.05);
    }
    .btn-control:disabled { 
      opacity: 0.4; 
      cursor: not-allowed; 
      transform: none; 
      background: var(--paper-deep);
      border-color: var(--line);
    }

    /* Ô ĐIỀN CHỮ BÊN PHẢI */
    .grid-container {
      display: flex;
      justify-content: center;
      gap: 12px; /* Tăng khoảng cách giữa các ô vuông */
      flex-wrap: wrap;
    }

    .char-input {
      width: 55px; /* Làm ô to ra một chút */
      height: 65px;
      font-size: 32px;
      text-align: center;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-weight: bold;
      color: var(--ink);
      transition: 0.2s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .char-input:focus { 
      outline: none; 
      border-color: var(--gold); 
      box-shadow: 0 0 0 4px rgba(201,162,75,0.15); 
    }
    .char-input.correct { border-color: var(--jade); background: var(--jade-soft); color: var(--jade); }
    .char-input.incorrect { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

    .punctuation {
      display: flex; align-items: flex-end; font-size: 32px; padding-bottom: 5px; color: var(--ink-soft);
    }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column-reverse; height: auto; }
      .sidebar { flex: auto; height: 400px; }
      .action-row { flex-direction: column-reverse; gap: 20px; }
    }
  </style>
</head>
<body>

  <h1>🎧 Nghe Chép Chính Tả (Pro Version)</h1>

  <div class="app-layout">
    <aside class="sidebar">
      <h2>📚 Danh sách câu</h2>
      <div class="sentence-list" id="sentenceList"></div>
    </aside>

    <main class="main-content">
      <div class="video-wrapper">
        <div id="ytplayer"></div>
      </div>

      <div class="interaction-area" id="inputArea" style="display: none;">
        <div class="vietnamese-hint" id="viHint">Bấm chọn câu bên trái để bắt đầu...</div>
        
        <!-- Bọc Điều hướng và Khung điền chữ chung một hàng -->
        <div class="action-row">
          <div class="controls-bar">
            <button id="btnPrev" class="btn-control" title="Câu trước">⏮</button>
            <button id="btnReplay" class="btn-control" title="Nghe lại">🔁</button>
            <button id="btnNext" class="btn-control" title="Câu tiếp">⏭</button>
          </div>
          
          <div class="grid-container" id="gridContainer"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const lessonData = {
        "videoId": "Mm2z0UcKMrg",
        "sentences": [
            { "id": 1, "start": 11.4, "end": 12.3, "cn": "我是學生", "vi": "Tôi là học sinh." },
            { "id": 2, "start": 14.4, "end": 15.2, "cn": "我是學生", "vi": "Tôi là học sinh." },
            { "id": 3, "start": 22.1, "end": 23.6, "cn": "我不是中国人", "vi": "Tôi không phải là người Trung Quốc." },
            { "id": 4, "start": 25.7, "end": 26.9, "cn": "我不是中国人", "vi": "Tôi không phải là người Trung Quốc." },
            { "id": 5, "start": 33.7, "end": 34.9, "cn": "你是哪国人?", "vi": "Bạn là người nước nào?" },
            { "id": 6, "start": 37.0, "end": 37.8, "cn": "你是哪国人", "vi": "Bạn là người nước nào?" },
            { "id": 7, "start": 44.5, "end": 45.8, "cn": "这是我的朋友", "vi": "Đây là bạn của tôi." },
            { "id": 8, "start": 47.9, "end": 48.9, "cn": "這是我的朋友", "vi": "Đây là bạn của tôi." },
            { "id": 9, "start": 55.9, "end": 57.2, "cn": "她是我的老師", "vi": "Cô ấy là giáo viên của tôi." },
            { "id": 10, "start": 59.3, "end": 60.4, "cn": "他是我的老師", "vi": "Anh ấy là giáo viên của tôi." },
            { "id": 11, "start": 66.9, "end": 68.3, "cn": "你叫什么名字?", "vi": "Bạn tên là gì?" },
            { "id": 12, "start": 70.3, "end": 71.3, "cn": "你叫什么名字", "vi": "Bạn tên là gì?" },
            { "id": 13, "start": 78.0, "end": 79.5, "cn": "我叫李明", "vi": "Tôi tên là Lý Minh." },
            { "id": 14, "start": 81.6, "end": 82.4, "cn": "我叫李明", "vi": "Tôi tên là Lý Minh." },
            { "id": 15, "start": 88.6, "end": 89.4, "cn": "我很好", "vi": "Tôi rất khỏe." },
            { "id": 16, "start": 91.5, "end": 92.1, "cn": "我很好", "vi": "Tôi rất khỏe." },
            { "id": 17, "start": 99.0, "end": 100.6, "cn": "今天天氣很好", "vi": "Thời tiết hôm nay rất tốt." },
            { "id": 18, "start": 102.8, "end": 104.0, "cn": "今天天气很好", "vi": "Thời tiết hôm nay rất tốt." },
            { "id": 19, "start": 110.3, "end": 111.2, "cn": "我想喝水", "vi": "Tôi muốn uống nước." },
            { "id": 20, "start": 113.4, "end": 114.1, "cn": "我想喝水", "vi": "Tôi muốn uống nước." },
            { "id": 21, "start": 120.8, "end": 122.5, "cn": "我喜欢吃米饭", "vi": "Tôi thích ăn cơm." },
            { "id": 22, "start": 124.6, "end": 125.8, "cn": "我喜欢吃米饭", "vi": "Tôi thích ăn cơm." }
        ]
    };

    let player;
    let checkTimeInterval;
    let currentIndex = -1; 

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer', {
        height: '360', width: '640', videoId: lessonData.videoId,
        playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0 }
      });
      initUI();
    }

    function initUI() {
      const listContainer = document.getElementById('sentenceList');
      
      lessonData.sentences.forEach((sentence, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-play-sentence';
        btn.id = `btn-sentence-${index}`;
        btn.innerText = `Câu ${sentence.id}: ${sentence.vi.substring(0, 20)}...`;
        btn.onclick = () => playSentence(index);
        listContainer.appendChild(btn);
      });

      document.getElementById('btnPrev').onclick = () => playSentence(currentIndex - 1);
      document.getElementById('btnNext').onclick = () => playSentence(currentIndex + 1);
      document.getElementById('btnReplay').onclick = () => playSentence(currentIndex);
    }

    function playSentence(index) {
      if (index < 0 || index >= lessonData.sentences.length) return;
      
      currentIndex = index;
      const sentence = lessonData.sentences[index];

      document.querySelectorAll('.btn-play-sentence').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-sentence-${index}`);
      activeBtn.classList.add('active');
      activeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }); 

      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('viHint').innerText = "Gợi ý: " + sentence.vi;

      document.getElementById('btnPrev').disabled = (currentIndex === 0);
      document.getElementById('btnNext').disabled = (currentIndex === lessonData.sentences.length - 1);

      player.seekTo(sentence.start);
      player.playVideo();

      clearInterval(checkTimeInterval);
      checkTimeInterval = setInterval(() => {
        if (player.getCurrentTime() >= sentence.end) {
          player.pauseVideo();
          clearInterval(checkTimeInterval);
        }
      }, 100);

      renderGrid(sentence.cn);
    }

    function renderGrid(chineseText) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = ''; 

      const punctuationRegex = /[，。！？、！?.,\s]/;

      for (let i = 0; i < chineseText.length; i++) {
        const char = chineseText[i];
        if (punctuationRegex.test(char)) {
          const span = document.createElement('span');
          span.className = 'punctuation';
          span.innerText = char;
          container.appendChild(span);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'char-input';
          input.maxLength = 1;
          input.dataset.correctChar = char; 
          container.appendChild(input);
        }
      }
      setupInputJumping();
    }

    function setupInputJumping() {
      const inputs = document.querySelectorAll('.char-input');
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          input.classList.remove('correct', 'incorrect'); 
          if (e.target.value && index < inputs.length - 1) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
          // Kiểm tra tự động bằng nút Enter
          if (e.key === 'Enter') checkAnswer();
        });
      });
      if(inputs.length > 0) inputs[0].focus();
    }

    function checkAnswer() {
      const inputs = document.querySelectorAll('.char-input');
      let allCorrect = true;
      inputs.forEach(input => {
        const userAnswer = input.value.trim();
        const correctAnswer = input.dataset.correctChar;
        input.classList.remove('correct', 'incorrect');
        if (userAnswer === correctAnswer) {
          input.classList.add('correct');
        } else {
          input.classList.add('incorrect');
          allCorrect = false;
        }
      });
      if (allCorrect) {
        setTimeout(() => alert("🎉 Quá chuẩn! Chuyển sang câu tiếp theo thôi!"), 100);
      }
    }
  </script>
</body>
</html>
